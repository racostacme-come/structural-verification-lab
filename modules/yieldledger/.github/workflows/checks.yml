name: Build and validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  numerical:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -m pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: clang-format --dry-run --Werror cpp/material.hpp cpp/bindings.cpp cpp/test_material.cpp
      - run: cmake -S . -B build/native -DYIELDLEDGER_PYTHON=OFF
      - run: cmake --build build/native --config Release
      - run: ctest --test-dir build/native -C Release --output-on-failure
      - run: yieldledger --output build/reproduced
      - run: python scripts/check_reproduction.py
      - run: python examples/two_layer.py
      - run: python -m build
      - name: Native sanitizers
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build/sanitized -DYIELDLEDGER_PYTHON=OFF -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build/sanitized
          ctest --test-dir build/sanitized --output-on-failure
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install manuscript toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern
          python -m pip install "pypdf>=6,<7"
      - run: python paper/build.py --engine pdflatex
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: academic-paper
          path: |
            paper/paper.pdf
            paper/validation.json
