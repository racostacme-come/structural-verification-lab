name: Verify C++ core, Python study and paper
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  numerical:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: clang-format --dry-run --Werror cpp/beam.hpp cpp/bindings.cpp cpp/test_beam.cpp
      - run: cmake -S . -B build/native -DBUCKLEMAP_PYTHON=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native --config Release
      - run: ctest --test-dir build/native -C Release --output-on-failure
      - run: python -m pytest -q
      - run: python scripts/check_samples.py
      - run: python scripts/check_manifest.py
      - run: python -m build
      - name: Verify installed wheel
        shell: bash
        run: |
          python -m pip uninstall -y bucklemap
          python -m pip install --no-deps dist/*.whl
          python -m pytest -q
          bucklemap solve --spring 10 --output output/wheel.json
  paper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-fonts-recommended poppler-utils
      - run: python scripts/check_samples.py
      - run: python scripts/check_manifest.py
      - run: python paper/build.py --engine pdflatex
      - run: pdftoppm -scale-to 1600 -png paper/paper.pdf paper/build/page
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-paper
          path: |
            paper/paper.pdf
            paper/validation.json
            paper/build/page-*.png
            paper/build/paper.log
