[build-system]
requires = ["scikit-build-core>=0.11,<2", "pybind11>=3,<4"]
build-backend = "scikit_build_core.build"

[project]
name = "bucklemap"
version = "0.1.0"
description = "Column eigenbuckling with elastic rotational restraints and analytical verification"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2", "pypdf>=6,<7", "clang-format==23.1.1"]

[project.scripts]
bucklemap = "bucklemap.cli:main"

[tool.scikit-build]
wheel.packages = ["src/bucklemap"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
